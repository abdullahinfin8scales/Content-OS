<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="description" content="Infin8 Content OS — a private writing and archive space for your social media content." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Infin8 Content OS</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('infin8.settings');
          var saved = raw ? JSON.parse(raw) : null;
          var pref = (saved && saved.state && saved.state.theme) || 'dark';
          if (pref === 'dark' || pref === 'light') {
            document.documentElement.dataset.theme = pref;
            document.documentElement.dataset.themeOwner = 'app';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
